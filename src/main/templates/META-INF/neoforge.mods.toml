license="${mod_license}"
issueTrackerURL="https://github.com/metrovoc/Reprise/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/metrovoc/Reprise"
authors="metrovoc"
description='''
Record your Minecraft sessions and replay them from any angle: scrub and rewind instantly, animate cameras with keyframes, and export cinematic video.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
